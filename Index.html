
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regalis Limo - Electronic Waybill</title>
<style>
* { box-sizing:border-box; }

:root {
  --black:#171717;
  --gold:#b99a5b;
  --border:#d8d5ce;
}

body {
  margin:0;
  padding:12px;
  background:#ecebe7;
  color:#222;
  font-family:Arial,Helvetica,sans-serif;
}

.page {
  width:100%;
  max-width:850px;
  margin:auto;
  padding:22px 28px;
  background:white;
  box-shadow:0 3px 18px #0001;
}

header {
  background:var(--black);
  color:white;
  text-align:center;
  padding:13px;
  border-bottom:3px solid var(--gold);
}

.brand {
  font-family:Georgia,serif;
  font-size:25px;
  letter-spacing:3px;
}

.tagline {
  color:#d8c49a;
  font-size:10px;
  font-style:italic;
  margin-top:4px;
}

h1 {
  text-align:center;
  font-size:17px;
  letter-spacing:2px;
  margin:12px 0;
}

.section {
  margin-top:10px;
  break-inside:avoid;
}

.section-title {
  background:var(--black);
  color:white;
  padding:5px 8px;
  font-size:10px;
  font-weight:bold;
  letter-spacing:1px;
  border-left:3px solid var(--gold);
}

.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px 12px;
  padding-top:7px;
}

.field {
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:3px;
  min-width:0;
}

.full { grid-column:1/-1; }

label {
  font-size:9px;
  font-weight:bold;
  color:#555;
  text-transform:uppercase;
}

input, select, textarea {
  display:block;
  width:100%;
  min-width:0;
  height:27px;
  border:1px solid var(--border);
  border-radius:2px;
  padding:4px 7px;
  font-family:Arial,Helvetica,sans-serif;
  font-size:11px;
  color:#222;
  background:white;
  text-align:left !important;
  direction:ltr;
  margin:0;
}

/* Force date and time values to align left on iPhone */
input[type="date"],
input[type="time"],
input[type="datetime-local"] {
  text-align:left !important;
  direction:ltr !important;
  -webkit-appearance:none;
  appearance:none;
  justify-content:flex-start;
  padding-left:7px;
}

input::-webkit-date-and-time-value {
  text-align:left;
  margin:0;
  min-width:100%;
}

textarea {
  height:38px;
  min-height:38px;
  resize:none;
}

.actions {
  max-width:850px;
  margin:14px auto;
  display:flex;
  justify-content:center;
  gap:10px;
}

button {
  border:0;
  padding:11px 17px;
  border-radius:4px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
}

.primary {
  background:var(--black);
  color:white;
}

.secondary {
  background:var(--gold);
  color:#171717;
}

@media(max-width:600px) {
  body { padding:6px; }
  .page { padding:12px; }
  .grid { grid-template-columns:1fr; }
  .full { grid-column:auto; }
  .brand { font-size:23px; }
}

@media print {
  @page {
    size:Letter portrait;
    margin:0.2in;
  }

  html, body {
    margin:0 !important;
    padding:0 !important;
    width:100%;
    background:white;
  }

  body {
    font-size:8px;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }

  .page {
    width:100%;
    max-width:none;
    margin:0;
    padding:0;
    box-shadow:none;
  }

  header {
    padding:9px;
  }

  .brand { font-size:21px; }
  .tagline { font-size:9px; }

  h1 {
    font-size:14px;
    margin:8px 0;
  }

  .section {
    margin-top:7px;
    break-inside:avoid;
  }

  .section-title {
    padding:4px 7px;
    font-size:8px;
  }

  .grid {
    gap:4px 10px;
    padding-top:5px;
  }

  label { font-size:7px; }

  input, select, textarea {
    height:22px;
    padding:2px 5px;
    font-size:9px;
    border:0;
    border-bottom:1px solid #aaa;
    border-radius:0;
    background:white;
    color:black;
  }

  input[type="date"],
  input[type="time"],
  input[type="datetime-local"] {
    text-align:left !important;
    direction:ltr !important;
    -webkit-appearance:none;
    appearance:none;
  }

  input::-webkit-date-and-time-value {
    text-align:left;
    margin:0;
  }

  textarea {
    height:30px;
    min-height:30px;
    border:1px solid #aaa;
  }

  .actions { display:none !important; }
}
</style>
</head>

<body>

<div class="page">

<header>
  <div class="brand">REGALIS LIMO</div>
  <div class="tagline">Ride Regal Arrive in Style</div>
</header>

<h1>ELECTRONIC WAYBILL</h1>

<div class="section">
  <div class="section-title">SERVICE INFORMATION</div>
  <div class="grid">

    <div class="field">
      <label>Service Date</label>
      <input type="date" id="serviceDate">
    </div>

    <div class="field">
      <label>Pickup Time</label>
      <input type="time">
    </div>

    <div class="field">
      <label>Service Type</label>
      <select>
        <option>Point-to-Point</option>
        <option>Airport Transfer</option>
        <option>Hourly Charter</option>
        <option>As Directed</option>
        <option>Other</option>
      </select>
    </div>

  </div>
</div>

<div class="section">
  <div class="section-title">CARRIER & VEHICLE INFORMATION</div>
  <div class="grid">

    <div class="field">
      <label>TCP Permit Number</label>
      <input placeholder="Enter TCP number">
    </div>

    <div class="field">
      <label>Company Name</label>
      <input value="Regalis Limo">
    </div>

    <div class="field">
      <label>Vehicle Make / Model</label>
      <input value="Chevrolet Suburban">
    </div>

    <div class="field">
      <label>Vehicle License Plate</label>
      <input placeholder="Enter license plate">
    </div>

    <div class="field">
      <label>Driver Name</label>
      <input placeholder="Enter driver name">
    </div>

  </div>
</div>

<div class="section">
  <div class="section-title">PASSENGER INFORMATION</div>
  <div class="grid">

    <div class="field">
      <label>Lead Passenger Name</label>
      <input placeholder="Passenger full name">
    </div>

    <div class="field">
      <label>Passenger Phone</label>
      <input type="tel" placeholder="Passenger phone">
    </div>

    <div class="field">
      <label>Number of Passengers</label>
      <input type="number" min="1" value="1">
    </div>

  </div>
</div>

<div class="section">
  <div class="section-title">TRIP DETAILS</div>
  <div class="grid">

    <div class="field full">
      <label>Pickup Address</label>
      <input placeholder="Full pickup address">
    </div>

    <div class="field full">
      <label>Destination Address</label>
      <input placeholder="Full destination address">
    </div>

    <div class="field">
      <label>Scheduled Start</label>
      <input type="datetime-local">
    </div>

    <div class="field">
      <label>Scheduled End</label>
      <input type="datetime-local">
    </div>

    <div class="field full">
      <label>Additional Stops / Notes</label>
      <textarea placeholder="Enter additional stops or trip notes"></textarea>
    </div>

  </div>
</div>

</div>

<div class="actions">
  <button class="primary" onclick="window.print()">
    PRINT / SAVE PDF
  </button>
  <button class="secondary" onclick="newWaybill()">
    NEW WAYBILL
  </button>
</div>

<script>
function setToday() {
  const d = new Date();
  const local = new Date(
    d.getTime() - d.getTimezoneOffset()*60000
  );
  document.getElementById("serviceDate").value =
    local.toISOString().slice(0,10);
}

function newWaybill() {
  if (!confirm("Start a new waybill? All information will be cleared.")) {
    return;
  }

  document.querySelectorAll("input, textarea").forEach(el => {
    if (el.type === "number") {
      el.value = el.defaultValue || "1";
    } else if (el.type !== "date") {
      el.value = "";
    }
  });

  document.querySelectorAll("select").forEach(el => {
    el.selectedIndex = 0;
  });

  setToday();
}

setToday();
</script>

</body>
</html>
