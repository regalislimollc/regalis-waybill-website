
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regalis Limo - Electronic Waybill</title>

<style>
* {
  box-sizing:border-box;
}

:root {
  --black:#171717;
  --gold:#b99a5b;
  --border:#d8d5ce;
}

body {
  margin:0;
  padding:12px;
  background:#ecebe7;
  color:#222;
  font-family:Arial,Helvetica,sans-serif;
}

.page {
  width:100%;
  max-width:850px;
  margin:auto;
  padding:22px 28px;
  background:white;
  box-shadow:0 3px 18px #0001;
}

header {
  background:var(--black);
  color:white;
  text-align:center;
  padding:13px;
  border-bottom:3px solid var(--gold);
}

.brand {
  font-family:Georgia,serif;
  font-size:25px;
  letter-spacing:3px;
}

.tagline {
  color:#d8c49a;
  font-size:10px;
  font-style:italic;
  margin-top:4px;
}

h1 {
  text-align:center;
  font-size:17px;
  letter-spacing:2px;
  margin:12px 0;
}

.section {
  margin-top:10px;
}

.section-title {
  background:var(--black);
  color:white;
  padding:5px 8px;
  font-size:10px;
  font-weight:bold;
  letter-spacing:1px;
  border-left:3px solid var(--gold);
}

.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px 12px;
  padding-top:7px;
}

.field {
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:3px;
  min-width:0;
}

.full {
  grid-column:1/-1;
}

label {
  font-size:9px;
  font-weight:bold;
  color:#555;
  text-transform:uppercase;
}

input, select, textarea {
  display:block;
  width:100%;
  min-width:0;
  height:27px;
  border:1px solid var(--border);
  border-radius:2px;
  padding:4px 7px;
  font-family:Arial,Helvetica,sans-serif;
  font-size:11px;
  color:#222;
  background:white;
  text-align:left !important;
  direction:ltr;
  margin:0;
}

input[type="date"],
input[type="time"] {
  text-align:left !important;
  direction:ltr !important;
  -webkit-appearance:none;
  appearance:none;
  padding-left:7px;
}

input::-webkit-date-and-time-value {
  text-align:left;
  margin:0;
  min-width:100%;
}

textarea {
  height:42px;
  min-height:42px;
  resize:vertical;
}

.actions {
  max-width:850px;
  margin:14px auto;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

button {
  border:0;
  padding:11px 17px;
  border-radius:4px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
}

.primary {
  background:var(--black);
  color:white;
}

.secondary {
  background:var(--gold);
  color:#171717;
}

@media(max-width:600px) {
  body {
    padding:6px;
  }

  .page {
    padding:12px;
  }

  .grid {
    grid-template-columns:1fr;
  }

  .full {
    grid-column:auto;
  }

  .brand {
    font-size:23px;
  }
}

@media print {

  @page {
    size:Letter portrait;
    margin:0.2in;
  }

  html, body {
    margin:0 !important;
    padding:0 !important;
    width:100%;
    background:white;
  }

  body {
    font-size:11px;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }

  .page {
    width:100%;
    max-width:none;
    margin:0;
    padding:0;
    box-shadow:none;
  }

  header {
    padding:7px;
  }

  .brand {
    font-size:22px;
  }

  .tagline {
    font-size:9px;
  }

  h1 {
    font-size:15px;
    margin:6px 0;
  }

  .section {
    display:block !important;
    visibility:visible !important;
    margin-top:5px;
    break-inside:avoid;
    page-break-inside:avoid;
  }

  .section-title {
    padding:4px 7px;
    font-size:10px;
  }

  .grid {
    display:grid !important;
    grid-template-columns:1fr 1fr;
    gap:4px 10px;
    padding-top:4px;
  }

  .field {
    display:flex !important;
    flex-direction:column;
    gap:2px;
  }

  .full {
    grid-column:1/-1;
  }

  label {
    font-size:10px;
  }

  input, select, textarea {
    height:27px;
    padding:3px 6px;
    font-size:13px;
    border:1px solid #aaa;
    border-radius:2px;
    background:white;
    color:black;
  }

  input[type="date"],
  input[type="time"] {
    text-align:left !important;
    direction:ltr !important;
    -webkit-appearance:none;
    appearance:none;
    font-size:12px;
  }

  input::-webkit-date-and-time-value {
    text-align:left !important;
    margin:0;
  }

  textarea {
    height:32px;
    min-height:32px;
    font-size:13px;
    border:1px solid #aaa;
  }

  #tripDetails {
    display:block !important;
    visibility:visible !important;
    break-inside:avoid;
    page-break-inside:avoid;
  }

  #tripDetails .grid {
    display:grid !important;
  }

  #tripDetails .field {
    display:flex !important;
  }

  .actions {
    display:none !important;
  }
}
</style>
</head>

<body>

<div class="page">

<header>
  <div class="brand">REGALIS LIMO</div>
  <div class="tagline">Ride Regal Arrive in Style</div>
</header>

<h1>ELECTRONIC WAYBILL</h1>

<!-- SERVICE INFORMATION -->
<div class="section">
  <div class="section-title">SERVICE INFORMATION</div>

  <div class="grid">

    <div class="field">
      <label>Service Date</label>
      <input type="date" id="serviceDate">
    </div>

    <div class="field">
      <label>Pickup Time</label>
      <input type="time">
    </div>

    <div class="field">
      <label>Service Type</label>
      <select>
        <option>Point-to-Point</option>
        <option>Airport Transfer</option>
        <option>Hourly Charter</option>
        <option>As Directed</option>
        <option>Other</option>
      </select>
    </div>

    <div class="field">
      <label>Flight Number</label>
      <input type="text" placeholder="e.g. UA 123">
    </div>

  </div>
</div>

<!-- CARRIER AND VEHICLE -->
<div class="section">
  <div class="section-title">CARRIER & VEHICLE INFORMATION</div>

  <div class="grid">

    <div class="field">
      <label>TCP Permit Number</label>
      <input placeholder="Enter TCP number">
    </div>

    <div class="field">
      <label>Company Name</label>
      <input value="Regalis Limo">
    </div>

    <div class="field">
      <label>Vehicle Make / Model</label>
      <input value="Chevrolet Suburban">
    </div>

    <div class="field">
      <label>Vehicle License Plate</label>
      <input placeholder="Enter license plate">
    </div>

    <div class="field">
      <label>Driver Name</label>
      <input placeholder="Enter driver name">
    </div>

  </div>
</div>

<!-- PASSENGER INFORMATION -->
<div class="section">
  <div class="section-title">PASSENGER INFORMATION</div>

  <div class="grid">

    <div class="field">
      <label>Lead Passenger Name</label>
      <input placeholder="Passenger full name">
    </div>

    <div class="field">
      <label>Passenger Phone</label>
      <input type="tel" placeholder="Passenger phone">
    </div>

  </div>
</div>

<!-- TRIP DETAILS -->
<div class="section" id="tripDetails">
  <div class="section-title">TRIP DETAILS</div>

  <div class="grid">

    <div class="field full">
      <label>Pickup Address</label>
      <input placeholder="Full pickup address">
    </div>

    <div class="field full">
      <label>Destination Address</label>
      <input placeholder="Full destination address">
    </div>

    <div class="field full">
      <label>Additional Stops / Notes</label>
      <textarea placeholder="Enter additional stops or trip notes"></textarea>
    </div>

  </div>
</div>

</div>

<div class="actions">

  <button class="primary" onclick="window.print()">
    PRINT / SAVE PDF
  </button>

  <button class="secondary" onclick="newWaybill()">
    NEW WAYBILL
  </button>

</div>

<script>
function setToday() {
  const d = new Date();

  const local = new Date(
    d.getTime() - d.getTimezoneOffset()*60000
  );

  document.getElementById("serviceDate").value =
    local.toISOString().slice(0,10);
}

function newWaybill() {

  if (!confirm("Start a new waybill? All information will be cleared.")) {
    return;
  }

  document.querySelectorAll("input, textarea").forEach(el => {
    if (el.type !== "date") {
      el.value = "";
    }
  });

  document.querySelectorAll("select").forEach(el => {
    el.selectedIndex = 0;
  });

  setToday();
}

setToday();
</script>

</body>
</html>
